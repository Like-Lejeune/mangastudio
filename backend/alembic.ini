# Migrations de la base MangaStudio.
#   alembic upgrade head                              applique les migrations en attente (fait aussi au démarrage de l'API)
#   alembic revision --autogenerate -m "description"  crée une migration après une modification de app/models.py
#   alembic downgrade -1                              annule la dernière migration
# L'adresse de la base vient du .env (DATABASE_URL), pas de ce fichier.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
