# MangaStudio derrière le nginx du VPS (installé par vps/deployer.sh dans /etc/nginx/sites-available/mangastudio).
# nginx garde les ports 80/443 pour tous les sites du VPS ; pour ces deux sous-domaines, il relaie à
# Caddy qui n'écoute qu'en local. certbot ajoute ensuite le HTTPS et la redirection http → https.
server {
    listen 80;
    listen [::]:80;
    server_name __APP_DOMAIN__ __API_DOMAIN__;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Remplace (et n'ajoute pas) : un visiteur ne peut pas se faire passer pour une autre adresse.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
